  <h1>破门，再听</h1>
  <p>上一版门框撕开的声音偏尖，没有接进游戏。下面三段是另外的 CC0 实地录音，原文件没有改调、没有滤波。破墙那一锤已经按你的选择接上了。</p>

  <article>
    <h2>1 · Talitha5 · 门栓扯破木门框</h2>
    <p>薄木门从里面闩住，外面用力撞开，门框木头被扯裂。Rode 话筒。1.9 秒。作者另叠了一下金属碰击。<a href="https://freesound.org/people/Talitha5/sounds/262538/">原页</a></p>
    <audio controls src="door_bolt.mp3"></audio>
  </article>

  <article>
    <h2>2 · qubodup · 重门关上</h2>
    <p>柏林一扇很重的门关上。Zoom H2。4.5 秒。这是关门的闷响，不是把门拆开。<a href="https://freesound.org/people/qubodup/sounds/218888/">原页</a></p>
    <audio controls src="door_heavy_slam.mp3"></audio>
  </article>

  <article>
    <h2>3 · LampEight · 朽木板被掰断</h2>
    <p>后院把一块朽掉的篱笆木板掰断。32.6 秒，里面有多次断裂。<a href="https://freesound.org/people/LampEight/sounds/400638/">原页</a></p>
    <audio controls src="door_fence.mp3"></audio>
  </article>
